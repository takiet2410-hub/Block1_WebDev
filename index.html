<!doctype html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NULL POINTER · Character Select</title>
  <meta name="description" content="Portfolio nhóm NULL POINTER: 4 thành viên theo phong cách màn hình chọn nhân vật trong game.">
  <meta name="theme-color" content="#07070F">
  <script>
    // set theme before first paint so light mode never flashes dark
    try {
      const m = localStorage.getItem("theme");
      const light = m === "light" || ((!m || m === "auto") && matchMedia("(prefers-color-scheme: light)").matches);
      document.documentElement.dataset.theme = light ? "light" : "dark";
    } catch {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Orbitron:wght@700;900&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#app">Bỏ qua tới nội dung</a>

  <div class="fx" aria-hidden="true">
    <div class="fx-glow"></div>
    <div class="fx-grid"></div>
    <div class="fx-lines"></div>
    <div class="fx-scan"></div>
    <div class="fx-noise"></div>
    <div class="fx-vignette"></div>
  </div>

  <header class="hud">
    <a class="logo" href="#/" aria-label="NULL POINTER, trang chủ"><span class="logo-mark" aria-hidden="true"></span><span class="logo-text">NULL<b>*</b>PTR</span></a>
    <p class="hud-mid label" id="hud-view">TEAM PROFILE</p>
    <div class="hud-right">
      <span class="status label"><i aria-hidden="true"></i>ONLINE</span>
      <nav class="hud-nav" aria-label="Điều hướng chính">
        <a class="hud-link label" href="#/" data-view="team">VỀ NHÓM</a>
        <a class="hud-link label" href="#/select" data-view="select">CHỌN NHÂN VẬT</a>
      </nav>
      <button class="sound-btn" id="sound" type="button" aria-pressed="false"></button>
      <button class="sound-btn" id="theme" type="button"></button>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <div id="boot" role="dialog" aria-modal="true" aria-labelledby="boot-title">
    <div class="intro-cast" id="intro-cast" aria-hidden="true"></div>
    <button class="boot-skip label" id="boot-skip" type="button">SKIP ›</button>
    <div class="boot-inner">
      <p class="label intro-kicker">A 4-PLAYER TEAM PORTFOLIO</p>
      <p class="boot-logo glitch" id="boot-title" data-text="NULL POINTER">NULL POINTER</p>
      <p class="intro-sub label">— CHARACTER SELECT —</p>
      <pre class="boot-log" id="boot-log" aria-live="polite"></pre>
      <div class="boot-row label"><span>LOADING</span><span><span id="boot-pct">0</span>%</span></div>
      <div class="boot-bar"><span id="boot-fill"></span></div>
      <button class="press-start" id="boot-start" type="button" hidden>PRESS START</button>
      <p class="intro-hint label">ENTER · CLICK · TAP</p>
    </div>
  </div>

  <div id="wipe" aria-hidden="true"><span></span></div>
  <dialog id="dlg" aria-labelledby="dlg-title"></dialog>
  <div class="reticle" aria-hidden="true"></div>
  <p id="toast" role="status" aria-live="polite"></p>
  <p id="sr" class="sr-only" aria-live="polite"></p>

  <script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/avatar3d.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
